const FW = { last: 0, bones: null, buf: null, gapAt: -99, nanAt: -99, nanN: 0 };

}

}

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3();

// ---------- Движение ОКНА для физики. Рокси в сцене стоит на месте, а по экрану ездит само окно
//            (ходьба, падение, перетаскивание). Пружинные кости этого не чувствуют, поэтому плащ вёл себя
//            «пластмассово», будто она стоит. Python шлёт координаты окна (winPos), отсюда скорость и ускорение
//            в м/с и м/с² (в координатах сцены: x вправо, y вверх).
const winM = { x: null, y: null, t: 0, vx: 0, vy: 0, ax: 0, ay: 0, rawx: 0, rawy: 0, seen: 0 };
const _wind = new THREE.Vector3(), _ext = new THREE.Vector3(), _gtmp = new THREE.Vector3();
let otherJ = [];                    // остальные пружинные цепочки (волосы, ленты, банты)
function winMotion(dt) {
  // скорость из последних присланных позиций, сглаженная; ускорение — из изменения сглаженной скорости
  const ppm = Math.max(1, 0.70 * window.innerHeight / H);
  const vx = winM.rawx / ppm, vy = -winM.rawy / ppm;      // экран y вниз → сцена y вверх
  winM.rawx *= Math.exp(-dt * 8); winM.rawy *= Math.exp(-dt * 8);   // нет новых сдвигов — скорость гаснет
  const k = Math.min(1, dt * 14);
  const nvx = winM.vx + (vx - winM.vx) * k, nvy = winM.vy + (vy - winM.vy) * k;
  const cl = (v, m) => Math.max(-m, Math.min(m, v));
  winM.ax = cl((nvx - winM.vx) / Math.max(dt, 1e-3), 30);
  winM.ay = cl((nvy - winM.vy) / Math.max(dt, 1e-3), 30);
  winM.vx = cl(nvx, 6); winM.vy = cl(nvy, 8);
}

// ---------- Вторичное движение: руки, кисти, голова догоняют позу упруго (с запаздыванием и лёгким
//            перелётом), а не встают в неё мгновенно — так у конечностей появляется вес.
//            [частота Гц, затухание ζ, группа]. Ноги пружинят только в воздухе и когда её держат.
const SEC = {
  leftUpperArm: [3.0, 0.66, 'arm'], rightUpperArm: [3.0, 0.66, 'arm'],
  leftLowerArm: [3.4, 0.55, 'arm'], rightLowerArm: [3.4, 0.55, 'arm'],
  leftHand: [4.2, 0.5, 'arm'], rightHand: [4.2, 0.5, 'arm'],
  neck: [3.6, 0.7, 'head'], head: [3.2, 0.62, 'head'],
  leftLowerLeg: [4.5, 0.5, 'leg'], rightLowerLeg: [4.5, 0.5, 'leg'],
  leftFoot: [5.5, 0.5, 'leg'], rightFoot: [5.5, 0.5, 'leg'],
};
const secS = {};
const _zero3 = [0, 0, 0];
function secondary(name, tgt, dt, mix) {
  const cfg = SEC[name];
  let st = secS[name];
  if (!st) st = secS[name] = { x: tgt.slice(), v: [0, 0, 0] };
  if (mix <= 0.001) { st.x = tgt.slice(); st.v = [0, 0, 0]; return tgt; }
  const w0 = 2 * Math.PI * cfg[0], z = cfg[1];
  const n = Math.max(1, Math.ceil(dt / 0.012)), h = dt / n;      // подшаги: устойчиво и при 20 кадрах/с
  for (let s = 0; s < n; s++) for (let i = 0; i < 3; i++) {
    st.v[i] += (w0 * w0 * (tgt[i] - st.x[i]) - 2 * z * w0 * st.v[i]) * h;
    st.x[i] += st.v[i] * h;
    if (Math.abs(st.x[i] - tgt[i]) > 1.2) { st.x[i] = tgt[i] + Math.sign(st.x[i] - tgt[i]) * 1.2; st.v[i] *= 0.5; }
  }

  return [0, 1, 2].map(i => tgt[i] + (st.x[i] - tgt[i]) * mix);
}
let vrm = null, B = {}, hips0 = null, L1 = 0.4, L2 = 0.4, H = 1.4, hipY = 0.75, topY = 1.5;

let mouth = 0, mouthTarget = 0;

const visT = { aa: 1, ih: 0, ou: 0, ee: 0, oh: 0 }, visW = { aa: 1, ih: 0, ou: 0, ee: 0, oh: 0 };

let look = { x: 0, y: 0 }, lookTarget = { x: 0, y: 0 };
let emotion = 'neutral', emotionTimer = null;
// разговор: жесты руками, кивки в такт; поза тела по эмоции

let talkW = 0, talkSeen = -10, gestNext = 0, gest = null, beatV = 0, beatX = 0, prevMouthT = 0;

function resize() {
  const W = window.innerWidth, Hc = window.innerHeight;
  renderer.setSize(W, Hc, false);
  renderer.domElement.style.width = W + 'px';
  renderer.domElement.style.height = Hc + 'px';
  camera.aspect = W / Hc;
  // модель занимает ~70% высоты окна, ступни у нижнего края; сверху и по бокам запас под руки/прыжки/танец
  const V = H / 0.70;
  const d = (V / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const yc = V * 0.47;
  camera.position.set(0, yc, d);
  camera.lookAt(0, yc, 0);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function projY(y) {
  const v = new THREE.Vector3(0, y, 0).project(camera);
  return (1 - v.y) / 2 * window.innerHeight;
}

// Границы «стоящей» модели. Не меняются от поз (иначе окно дёргается).

window._stableBounds = () => {
  const top = projY(topY), bottom = projY(0);

  return { x: window.innerWidth / 2 - wpx / 2, y: top, width: wpx, height: h };

const P = {};   // накопитель поворотов за кадр: P[bone] = [x, y, z]

const env = (t, a, b, fi, fo) => smooth((t - a) / fi) * (1 - smooth((t - (b - fo)) / fo));

const FINGERS = ['Index', 'Middle', 'Ring', 'Little'];

    add(side + f + 'Intermediate', 0, 0, -sg * 0.15 * k);      // выпрямить (в покое пальцы чуть согнуты)

  prevMouthT = mouthTarget;
  beatV += (-90 * beatX - 11 * beatV) * dt; beatX += beatV * dt;
  add('head', 0.06 * beatX * talkW); add('neck', 0.03 * beatX * talkW);

  // тело по эмоции (плавно появляется и уходит вместе с выражением лица)
  for (const n of ['happy', 'sad', 'angry', 'surprised', 'shy', 'smug']) emoW[n] = ease(emoW[n] || 0, emotion === n ? 1 : 0, dt, 2.5);
  const ek = (1 - animW) * (1 - heldW);
  if (emoW.sad > 0.01) {                       // ссутулилась: плечи вниз и вперёд, голова опущена
    const k = emoW.sad * ek;
    add('spine', 0.08, 0, 0, k); add('chest', 0.05, 0, 0, k); add('neck', 0.06, 0, 0, k); add('head', 0.12, 0, 0, k);
    add('leftShoulder', 0, 0, -0.06, k); add('rightShoulder', 0, 0, 0.06, k);
  }
  if (emoW.happy > 0.01) {                     // грудь расправлена, голова чуть вверх
    const k = emoW.happy * ek;
    add('chest', -0.04, 0, 0, k); add('head', -0.04, 0, 0.03 * Math.sin(time * 1.3), k);
    add('leftUpperArm', 0, 0, 0.06, k); add('rightUpperArm', 0, 0, -0.06, k);
  }
  if (emoW.angry > 0.01) {                     // кулаки, корпус чуть вперёд, взгляд исподлобья
    const k = emoW.angry * ek;
    handCurl('left', 0.95, k); handCurl('right', 0.95, k);
    add('spine', 0.05, 0, 0, k); add('head', 0.07, 0, 0, k);
    add('leftUpperArm', 0, 0, -0.06, k); add('rightUpperArm', 0, 0, 0.06, k);
  }
  if (emoW.surprised > 0.01) {                 // отшатнулась, руки приподняты, ладони раскрыты
    const k = emoW.surprised * ek;
    add('spine', -0.05, 0, 0, k); add('head', -0.08, 0, 0, k);
    add('leftUpperArm', -0.15, 0, 0.25, k * (1 - busyL)); add('rightUpperArm', -0.15, 0, -0.25, k * (1 - busyR));
    add('leftLowerArm', 0, -0.6, 0, k * (1 - busyL)); add('rightLowerArm', 0, 0.6, 0, k * (1 - busyR));
    handCurl('left', -0.3, k); handCurl('right', -0.3, k);
  }
  if (emoW.shy > 0.01) {                       // голова вниз и вбок, плечи приподняты, руки сложены спереди
    const k = emoW.shy * ek;
    add('head', 0.12, 0.08, 0.1, k); add('leftShoulder', 0, 0, 0.06, k); add('rightShoulder', 0, 0, -0.06, k);
    if (stand > 0.5) ikReq.push({ side: 'left', type: 'front', w: k * 0.8 }, { side: 'right', type: 'front', w: k * 0.8 });
  }
  if (emoW.smug > 0.01) {                      // рука на бедре, подбородок вверх, голова набок
    const k = emoW.smug * ek;
    add('head', -0.06, 0, 0.08, k); add('chest', -0.03, 0, 0, k);
    if (stand > 0.5) ikReq.push({ side: 'right', type: 'hip', w: k * 0.85 });
  }

  // ---- ходьба: каденс под реальную скорость окна (ступни не «скользят»),
  //      перекат пятка → носок, сгиб колена в переносе, таз и плечи в противофазе, руки с запаздыванием ----
  let bob = 0;
  if (w.walk > 0.01) {
    const ppm = 0.70 * window.innerHeight / H;           // пикселей на метр
    const step = 2 * (L1 + L2) * GAIT_STEP;               // длина шага (м): каденс под реальную скорость окна
    const hz = Math.min(1.1, Math.max(0.45, (walkSpeed / ppm) / (2 * step * 0.9)));
    walkPhase += dt * Math.PI * 2 * hz;
    const k = w.walk * (1 - w.air);
    const gp = walkPhase / (Math.PI * 2);                  // доля цикла левой ноги; правая — со сдвигом 0.5
    const drops = [];
    const leg = (side, p) => {
      const f = gaitAt(GAIT.thigh, p) * DEG, kn = gaitAt(GAIT.knee, p) * DEG, an = gaitAt(GAIT.ankle, p) * DEG;
      add(side + 'UpperLeg', -f, 0, 0, k);                // в позах: + назад, − вперёд
      add(side + 'LowerLeg', kn, 0, 0, k);
      add(side + 'Foot', -an, 0, 0, k);                   // в позах: − носок вверх
      drops.push(legDrop(f, kn));
    };
    leg('left', gp); leg('right', gp + 0.5);
    // таз опускается настолько, насколько «короче» сейчас опорная (самая длинная) нога — ступня не висит и не проваливается
    bob = -Math.min(drops[0], drops[1]) * k;
    // таз и корпус: поворот таза к выносимой ноге, опускание таза со стороны переноса, плечи в противофазе
    // фаза корпуса и рук: a = π/2 в момент, когда левое бедро дальше всего впереди (≈90 % цикла по таблице)
    const a = walkPhase - (0.9 * Math.PI * 2 - Math.PI / 2);
    const s = Math.sin(a), c = Math.cos(a), s2 = Math.sin(2 * a);
    add('hips', 0, 0.07 * s, 0.03 * c, k);
    add('spine', 0.05 + 0.012 * s2, -0.06 * s, -0.02 * c, k); add('chest', 0.02, -0.05 * s, 0, k);
    // голова на ходу держится ровно: гасим повороты корпуса и таза (у людей взгляд при шаге стабилен)
    add('neck', 0, 0.02 * s, -0.005 * c, k); add('head', 0.02 * Math.sin(2 * a), 0.01 * s, -0.005 * c, k);
    // руки: идут за противоположной ногой с небольшим запаздыванием; локоть сгибается сильнее, когда рука впереди
    // руки как у человека, а не маятник «лего»: вперёд уходят дальше, чем назад; локоть всегда мягко согнут
    // и сгибается сильнее, когда рука впереди; плечо слегка развёрнуто внутрь (ладонь к бедру);
    // размах растёт со скоростью шага, а предплечье и кисть догоняют с запаздыванием (пружины SEC)
    const amp = Math.min(1, 0.55 + 0.5 * hz), sa = Math.sin(a - 0.3);
    const armSw = (v) => (v > 0 ? 0.17 : 0.27) * v * amp;          // + назад, − вперёд
    const fwdL = Math.max(0, -sa), fwdR = Math.max(0, sa);
    add('leftUpperArm', armSw(sa), -0.03, 0.08, k); add('rightUpperArm', armSw(-sa), 0.03, -0.08, k);
    add('leftLowerArm', 0, -0.08 - 0.42 * fwdL * amp, 0, k);
    add('rightLowerArm', 0, 0.08 + 0.42 * fwdR * amp, 0, k);
    add('leftHand', 0.08 * Math.sin(a - 0.9), 0, 0, k); add('rightHand', -0.08 * Math.sin(a - 0.9), 0, 0, k);
  }

  // ---- сидит на краю окна: бёдра почти горизонтально, голени свисают и не спеша болтаются
  //      (то сильнее, то почти замирают), стопы расслабленно оттянуты, руки лежат на коленях ----
  if (w.sit > 0.01) {
    const k = w.sit * (1 - w.air), t = time * 1.7;
    const amp = 0.12 + 0.2 * (0.5 + 0.5 * Math.sin(time * 0.21)) + 0.2 * happy;
    const pl = t, pr = t + Math.PI * 0.9 + 0.5 * Math.sin(time * 0.13);
    // колени вместе, голени чуть врозь: так сидят в короткой юбке (между бёдер не видно белья)
    add('leftUpperLeg', -1.3, 0.03, -0.07, k); add('rightUpperLeg', -1.3, -0.03, 0.07, k);
    add('leftLowerLeg', 1.3 + amp * Math.sin(pl), 0, 0.12, k); add('rightLowerLeg', 1.3 + amp * Math.sin(pr), 0, -0.12, k);
    add('leftFoot', 0.35 + 0.5 * amp * Math.sin(pl - 0.8), 0, 0, k); add('rightFoot', 0.35 + 0.5 * amp * Math.sin(pr - 0.8), 0, 0, k);
    add('leftUpperArm', -0.62, 0, -0.2, k); add('rightUpperArm', -0.62, 0, 0.2, k);   // ладони лежат на бёдрах поверх юбки
    add('leftLowerArm', 0, -0.32, 0, k); add('rightLowerArm', 0, 0.32, 0, k);
    add('leftHand', 0, 0, -0.1, k); add('rightHand', 0, 0, 0.1, k);
    add('spine', 0.12, 0, 0.025 * Math.sin(time * 0.5), k); add('chest', 0.04, 0, 0, k);
    add('head', 0.04, 0, 0.04 * Math.sin(time * 0.37), k);
  }

  // ---- прыжок: присед с замахом рук назад → толчок, руки вперёд-вверх → в полёте ноги поджаты,
  //      к концу полёта выпрямляются навстречу земле → приземление с амортизацией, руки в стороны для равновесия ----
  const cr = Math.max(w.crouch * (1 - w.air), landW);
  let drop = 0;
  if (cr > 0.01) {
    const th = 0.75 * cr, kn = 1.5 * cr;
    add('leftUpperLeg', -th); add('rightUpperLeg', -th);
    add('leftLowerLeg', kn); add('rightLowerLeg', kn);
    add('leftFoot', -(kn - th) * 0.9); add('rightFoot', -(kn - th) * 0.9);
    add('spine', 0.35 * cr); add('head', -0.2 * cr);
    const back = landT >= 0 ? -0.35 : 0.55;                // при приземлении руки идут вперёд, перед прыжком — назад
    add('leftUpperArm', back * cr, 0, 0.25 * cr); add('rightUpperArm', back * cr, 0, -0.25 * cr);
    handCurl('left', 0.25, cr); handCurl('right', 0.25, cr);
    drop = legDrop(th, kn) * (1 - w.sit);
  }
  // ---- шляпа слетела: присела, дотянулась, встала и надела обратно ----
  if (hatFall.st === 'pick') {
    const T = hatFall.t, c = env(T, 0.25, 2.5, 0.75, 0.8), sd = hatFall.side;
    const th = 1.05 * c, kn = 2.0 * c;
    // колени вместе, голени врозь — в юбке так и приседают
    add('leftUpperLeg', -th, 0, -0.1 * c); add('rightUpperLeg', -th, 0, 0.1 * c);
    add('leftLowerLeg', kn, 0, 0.2 * c); add('rightLowerLeg', kn, 0, -0.2 * c);
    add('leftFoot', -(kn - th) * 0.9); add('rightFoot', -(kn - th) * 0.9);
    add('spine', 0.45 * c); add('chest', 0.15 * c);
    add('head', 0.3 * env(T, 0, 2.2, 0.4, 0.6) - 0.15 * env(T, 2.3, 3.4, 0.3, 0.5));   // смотрит на шляпу, потом вверх
    drop += legDrop(th, kn);
    const wI = env(T, 0.35, 3.7, 0.55, 0.5);
    ikReq.push({ side: sd, type: T < 1.35 ? 'hatGrab' : T < 2.25 ? 'hatHold' : 'hatHead', w: wI });
    handCurl(sd, T > 1.2 && T < 3.2 ? 0.55 : 0.1, wI);
    // свободная рука — для равновесия чуть в сторону
    const o = sd === 'left' ? 'right' : 'left', sg = o === 'left' ? 1 : -1;
    add(o + 'UpperArm', -0.25 * c, 0, sg * 0.35 * c);
  }
  if (w.air > 0.01) {
    const k = w.air, rise = smooth(Math.min(1, airT / 0.25)), ext = smooth((airT - 0.4) / 0.35);
    const tuck = rise * (1 - 0.55 * ext), throwA = pulse(airT, 0.45);
    add('leftUpperLeg', -1.1 * tuck, 0, 0.05, k); add('rightUpperLeg', -0.85 * tuck, 0, -0.05, k);
    add('leftLowerLeg', 1.9 * tuck, 0, 0, k); add('rightLowerLeg', 1.7 * tuck, 0, 0, k);
    add('leftFoot', 0.4, 0, 0, k); add('rightFoot', 0.4, 0, 0, k);
    add('leftUpperArm', -0.3 - 0.5 * throwA, 0, 0.75, k); add('rightUpperArm', -0.3 - 0.5 * throwA, 0, -0.75, k);
    add('spine', 0.12 - 0.1 * throwA, 0, 0, k); add('head', -0.1 * throwA, 0, 0, k);
    handCurl('left', -0.2, k); handCurl('right', -0.2, k);   // пальцы раскрыты
  }

  // ---- держат курсором: болтается, медленно и неуклюже перебирает ногами, плавно машет руками.
  //      Раньше было 7–9 Гц плюс мелкая тряска — выглядело как вибрация. Теперь ~0.6 Гц, движения тяжёлые,
  //      из нескольких медленных волн разной частоты, чтобы не повторялись как метроном. ----
  if (heldW > 0.01) {
    const k = heldW, t = heldT;
    const wave = (f, ph) => Math.sin(t * f + ph);
    const panic = 0.6 + 0.4 * smooth(0.5 + 0.5 * wave(0.45, 0));          // приступы «паники» и затишья, ~14 с
    // ноги: болтаются, по очереди медленно поджимает колено (как будто ищет опору)
    const kick = 3.6;
    const l = wave(kick, 0) * 0.7 + wave(kick * 0.53, 1.3) * 0.3, r = wave(kick, 2.6) * 0.7 + wave(kick * 0.61, 0.4) * 0.3;
    add('leftUpperLeg', -0.2 - 0.38 * panic * Math.max(0, l), 0, 0.06, k);
    add('rightUpperLeg', -0.2 - 0.38 * panic * Math.max(0, r), 0, -0.06, k);
    add('leftLowerLeg', 0.3 + 0.75 * panic * (0.5 + 0.5 * wave(kick, 0.9)), 0, 0, k);
    add('rightLowerLeg', 0.3 + 0.75 * panic * (0.5 + 0.5 * wave(kick, 3.5)), 0, 0, k);
    add('leftFoot', 0.45 + 0.15 * l, 0, 0, k); add('rightFoot', 0.45 + 0.15 * r, 0, 0, k);
    // руки: разведены в стороны, плавно и несинхронно загребают воздух
    const fa = wave(2.9, 0) * 0.65 + wave(1.7, 2.1) * 0.35, fb = wave(3.3, 1.7) * 0.65 + wave(1.9, 0.6) * 0.35;
    // кисти не выше плеч и не загибаются к голове: на взмахе ладони заходили в поля шляпы
    add('leftUpperArm', -0.3 + 0.3 * fb * panic, 0, 1.2 + 0.3 * fa * panic, k);
    add('rightUpperArm', -0.3 - 0.3 * fa * panic, 0, -1.2 - 0.3 * fb * panic, k);
    add('leftLowerArm', 0, -0.35 - 0.3 * Math.max(0, fb) * panic, 0.2 * fa, k);
    add('rightLowerArm', 0, 0.35 + 0.3 * Math.max(0, fa) * panic, -0.2 * fb, k);
    add('leftHand', 0.25 * fa, 0, 0, k); add('rightHand', -0.25 * fb, 0, 0, k);
    handCurl('left', -0.3, k); handCurl('right', -0.3, k);
    // корпус: таз качается маятником (ноги летят за ним), спина и голова компенсируют; плечи зажаты
    add('hips', 0.08, 0, swing, k);
    add('spine', -0.06, 0.07 * wave(1.6, 0), -0.75 * swing, k);
    add('chest', -0.05, 0, -0.2 * swing, k);
    add('leftShoulder', 0, 0, 0.12, k); add('rightShoulder', 0, 0, -0.12, k);
    // голова: то смотрит вниз (высоко же!), то по сторонам — медленно
    const peek = smooth(0.5 + 0.5 * wave(1.1, 0));
    add('neck', 0.08 * peek, 0, -0.3 * swing, k);
    add('head', 0.26 * peek, 0.24 * wave(1.4, 0.5), 0.05 * wave(2.2, 1.0), k);
  }

  // толкает окно (идёт шагом): обе ладони на краю окна, корпус вперёд — поверх шага
  if (edgeW > 0.001 && edgeMode === 'push') {
    const ew = edgeW * (1 - w.air) * (1 - heldW) * (1 - w.sit) * (1 - animW);
    // окно — плита ~7 см: ладони упираются в торец, пальцы загибаются на лицевую сторону (обхват)
    ikReq.push({ side: 'left', type: 'edge', w: ew, y: -0.05 }, { side: 'right', type: 'edge', w: ew, y: -0.2 });
    edgeGrip('left', ew); edgeGrip('right', ew);
    edgeHold = ew;
    add('spine', 0.14, 0, 0, ew); add('chest', 0.06, 0, 0, ew); add('head', -0.1, 0, 0, ew);
  }
  // ---- анимации ----
  let yawExtra = 0, rootY = 0, standOnly = (1 - w.sit);
  eyeYaw = 0;
  if (anim) {
    anim.t += dt;
    const t = anim.t, D = anim.dur, e = env(t, 0, D, 0.45, 0.5);
    switch (anim.name) {
      case 'dance': {
        // A: шаг-приставка с покачиванием, по очереди машет рукой над головой;
        // B: кружится с руками в стороны; C: пружинит, обе руки вверх, качает головой
        const f = 1.1, b = Math.sin(t * Math.PI * 2 * f), b2 = Math.sin(t * Math.PI * 4 * f);
        const A = env(t, 0, 2.9, 0.45, 0.35), Bp = env(t, 2.7, 4.3, 0.3, 0.3), C = env(t, 4.1, D, 0.35, 0.55);
        const sw = A + C;
        add('hips', 0, 0.2 * b, 0.1 * b, sw); add('spine', 0, -0.12 * b, -0.08 * b, sw); add('chest', 0, -0.05 * b, -0.04 * b, sw);
        add('leftUpperLeg', -0.3 * Math.max(0, b), 0, 0, sw); add('leftLowerLeg', 0.65 * Math.max(0, b), 0, 0, sw);
        add('rightUpperLeg', -0.3 * Math.max(0, -b), 0, 0, sw); add('rightLowerLeg', 0.65 * Math.max(0, -b), 0, 0, sw);
        add('head', 0, 0.05 * b, 0.12 * b, sw);
        rootY += 0.012 * H * Math.abs(b) * sw;
        const sel = smooth((t - 1.25) / 0.4);                    // сначала машет левой, потом правой
        const Lk = Math.min(1, A * (1 - sel) + C), Rk = Math.min(1, A * sel + C);
        add('leftUpperArm', -0.25, 0, 2.3 + 0.25 * b2, Lk); add('leftLowerArm', 0, 0, 0.5 + 0.45 * b2, Lk);
        add('rightUpperArm', -0.25, 0, -2.3 + 0.25 * b2, Rk); add('rightLowerArm', 0, 0, -0.5 + 0.45 * b2, Rk);
        handCurl('left', -0.3, Lk); handCurl('right', -0.3, Rk);
        yawExtra += Math.PI * 2 * smooth((t - 2.75) / 1.45);
        add('leftUpperArm', -0.2, 0, 0.5, Bp); add('rightUpperArm', -0.2, 0, -0.5, Bp);   // руки чуть в стороны, локти мягкие
        add('leftLowerArm', 0, -0.45, 0, Bp); add('rightLowerArm', 0, 0.45, 0, Bp);
        rootY += 0.02 * H * Bp;
        expr('happy', 0.8 * e);
        break; }
      case 'spin': {
        yawExtra = Math.PI * 2 * smooth((t - 0.2) / 1.45);
        const a = env(t, 0, D, 0.3, 0.4);
        add('leftUpperArm', -0.2, 0, 0.5, a); add('rightUpperArm', -0.2, 0, -0.5, a);
        add('leftLowerArm', 0, -0.45, 0, a); add('rightLowerArm', 0, 0.45, 0, a);
        add('leftFoot', 0.3 * standOnly, 0, 0, a); add('rightFoot', 0.3 * standOnly, 0, 0, a);
        rootY += 0.02 * H * a * standOnly; expr('happy', 0.6 * a);
        break; }
      case 'bow': {
        const down = env(t, 0.35, 2.35, 0.6, 0.65), hand = env(t, 0, 2.6, 0.45, 0.55);
        add('spine', 0.42 * down); add('chest', 0.2 * down); add('neck', 0.1 * down); add('head', 0.22 * down);
        add('rightUpperArm', -0.4, 0.75, -0.05, hand); add('rightLowerArm', 0, 1.65, 0, hand);   // ладонь к груди (плечо развёрнуто внутрь)
        add('leftUpperArm', 0.18, 0, 0.08, hand);
        handCurl('right', -0.25, hand);
        expr('blink', 0.55 * down); expr('happy', 0.7 * smooth((t - 1.8) / 0.6) * e);
        break; }
      case 'stretch': {
        const up = env(t, 0, D, 0.85, 0.9), side = env(t, 1.0, 2.9, 0.35, 0.35) * Math.sin(Math.PI * 2 * (t - 1.0) / 1.9);
        // руки вверх буквой V и чуть вперёд: строго вверх они проходили сквозь широкие поля шляпы
        add('leftUpperArm', -0.25 * up, 0, 2.2 * up); add('rightUpperArm', -0.25 * up, 0, -2.2 * up);
        add('leftLowerArm', 0, 0, 0.4 * up); add('rightLowerArm', 0, 0, -0.4 * up);
        handCurl('left', 0.5, up); handCurl('right', 0.5, up);
        add('spine', -0.15 * up, 0, 0.16 * side); add('chest', 0, 0, 0.08 * side); add('head', -0.22 * up, 0, 0.06 * side);
        add('leftFoot', 0.35 * up * standOnly); add('rightFoot', 0.35 * up * standOnly);   // на носочки
        rootY += 0.022 * H * up * standOnly;
        expr('relaxed', 0.7 * up); expr('blink', 0.85 * env(t, 0.8, 3.0, 0.4, 0.4));
        break; }
      case 'yawn': {
        const hand = env(t, 0.15, 2.7, 0.55, 0.55), open = env(t, 0.35, 2.5, 0.75, 0.6);
        // ладонью прикрывает рот — через IK, локоть ВНИЗУ. Раньше плечо задиралось вперёд почти до горизонтали,
        // и накидка тянулась за ним «трубой»
        add('rightLowerArm', 0, 0.9, 0, hand);                    // заранее согнутый локоть — IK доводит остальное
        ikReq.push({ side: 'right', type: 'mouth', w: hand });
        handCurl('right', -0.1, hand);

        handCurl('right', 1.2, k);
        ikReq.push({ side: 'left', type: 'hip', w: 0.8 * k }); handCurl('left', 0.5, 0.8 * k);

      case 'staff_twirl': {

        add('head', 0, 0, 0.06 * fl); add('neck', -0.05 * fl);   // смотрит на посох

      case 'look_around': {

        const y = 0.6 * (smooth((t - 0.2) / 0.7) - 2 * smooth((t - 1.7) / 0.9) + smooth((t - 3.4) / 0.8));

  }

    if (gesture.name === 'shake') { add('head', 0, 0.3 * Math.sin(gesture.t * Math.PI * 2 * 2.1) * g, 0.04 * g); add('neck', 0, 0.08 * Math.sin(gesture.t * Math.PI * 2 * 2.1 - 0.4) * g); }
    if (gesture.t >= gesture.dur) gesture = null;
  }

  // взгляд: голова + глаза следят за курсором
  look.x = ease(look.x, lookTarget.x, dt, 4); look.y = ease(look.y, lookTarget.y, dt, 4);
  const lk = (1 - 0.95 * w.walk) * (1 - 0.8 * heldW);   // на ходу голова за курсором не крутится (дёргалась)
  add('neck', -0.12 * look.y, 0.25 * look.x, 0, lk); add('head', -0.2 * look.y, 0.35 * look.x, 0, lk);

  // поворот корпуса: при ходьбе — в профиль по ходу, стоя/сидя — чуть в сторону

  const yawT = facing * (0.18 + (Math.PI / 2 - 0.18) * w.walk + 0.15 * w.sit);
  yaw = ease(yaw, yawT, dt, 5);
  root.rotation.y = yaw + yawExtra;
  root.rotation.z = -lean * 0.12 * leanW;                 // наклон всем телом к стене (поворот вокруг ступней)
  if (leanW > 0.001) { add('leftFoot', 0, 0, lean * 0.12 * leanW); add('rightFoot', 0, 0, lean * 0.12 * leanW); }
  if (edgeW > 0.001) {                                     // выглядывает — клонится из-за края наружу; толкает — к окну
    const tz = (edgeMode === 'peek' ? 0.2 : 0.15) * edgeW * stand;
    root.rotation.z -= edgeDir * tz;
    add('leftFoot', 0, 0, edgeDir * tz); add('rightFoot', 0, 0, edgeDir * tz);
  }

  // маленькие подскоки (радость): присела → подскок с поджатыми ногами → мягко приземлилась
  hops = hops.filter(h => time < h.t + 0.38);
  for (const h of hops) if (time >= h.t) {
    const u = (time - h.t) / 0.38;
    rootY += 0.045 * H * h.h * Math.max(0, Math.sin(Math.PI * (u - 0.12) / 0.76));
    const tk = Math.sin(Math.PI * u) * standOnly;
    add('leftUpperLeg', -0.25 * tk); add('rightUpperLeg', -0.25 * tk);
    add('leftLowerLeg', 0.55 * tk); add('rightLowerLeg', 0.55 * tk);
    add('leftUpperArm', 0, 0, 0.25 * tk); add('rightUpperArm', 0, 0, -0.25 * tk);
  }

  // ---- ткань: сидя юбка и полы плаща тяжелеют и ложатся на бёдра (гравитация + коллайдеры ног),
  //      стоя/в движении — почти исходная упругость, но с лёгким провисанием ----
  //      Как у настоящей ткани: перед юбки трением «прилипает» к верху бёдер и тянется к коленям,
  //      бока свисают по внешней стороне бёдер, зад остаётся под попой.
  const sw = w.sit, ry = root.rotation.y;
  const fwd = _v1.set(Math.sin(ry), 0, Math.cos(ry)), left = _v2.set(Math.cos(ry), 0, -Math.sin(ry));
  for (const j of skirtJ) {
    const o = j._s0, onLeg = j._part === 'front' && j._onLeg;

    // Раньше упругость падала на 85 %, гравитация тянула вперёд, а толстые шары ног держали ткань над коленями.
    // у пояса перед держит форму и лежит на бёдрах, к краю мягчает и тяжелеет: за коленями ткань свисает вниз,
    // а не торчит «домиком» доской вперёд
    const tip = j._depth || 0;
    j.settings.stiffness = o.stiffness * (onLeg ? (1 + LAP_ST * sw) * (1 - 0.4 * sw * tip) : 1 - 0.85 * sw);
    j.settings.dragForce = Math.min(0.9, o.dragForce + 0.1 + 0.35 * sw);
    j.settings.hitRadius = o.hitRadius * (1 + 0.25 * sw);
    // капсула корпуса — только стоя. Сидя корни юбки зажимало между ней и бёдрами, и перед юбки
    // выворачивало вверх (было видно бельё). Сидя юбку держат бёдра.
    if (j._cgStand || j._cgSit) j.colliderGroups = sw > 0.15 ? (j._cgSit || o.cg) : (j._cgStand || o.cg);
    const g = j.settings.gravityDir, side = j._left ? 1 : -1;
    if (onLeg) g.set(0, -1, 0);
    else if (j._part === 'front') g.set(0, -1, 0).lerp(_v3.copy(fwd).multiplyScalar(1).add(_v4.set(0, -0.35, 0)), sw);
    else if (j._part === 'side') g.set(0, -1, 0).lerp(_v3.copy(fwd).multiplyScalar(0.55).addScaledVector(left, 0.3 * side).add(_v4.set(0, -1, 0)), sw);
    else g.set(0, -1, 0);
    g.normalize();
    j.settings.gravityPower = o.gravityPower + 0.08 + (onLeg ? 0.12 + 0.3 * tip : j._part === 'back' ? 0.6 : 1.1) * sw;
  }
  for (const j of coatJ) {
    const o = j._s0, tip = j._depth;                  // 0 — у плеч, 1 — нижний край
    // настоящая ткань: у плеч держит форму, к краю всё мягче и тяжелее; лёгкое сопротивление воздуха
    j.settings.stiffness = o.stiffness * (1 - 0.6 * sw) * (1 - 0.3 * tip);        // край мягче, но не провисает в тело
    // длинный плащ (CoatSkirtLong) расходится назад колоколом — почти без добавки гравитации, иначе низ
    // тянуло вертикально вниз, к телу, в ноги и юбку; сидя — тяжелеет и ложится
    j.settings.gravityPower = j._long ? o.gravityPower + 0.02 * tip + 0.5 * sw : o.gravityPower + 0.06 + 0.06 * tip + 0.7 * sw;
    j.settings.dragForce = Math.min(0.9, o.dragForce + 0.06 + 0.3 * sw);
    // ноги при ходьбе задевают полы плаща (раньше только сидя) — плащ огибает их, а не проходит насквозь
    // ноги отталкивают полы только сидя: на ходу коллайдеры ног подворачивали край плаща изнанкой наружу
    j.settings.hitRadius = Math.max(o.hitRadius, 0.03 * sw);
    let cgBase = j._cgStand || o.cg || [];
    // рука на бедре: локоть отведён назад-вбок, и шары руки распирали плащ «шатром» — он висел на локте и не касался
    // бока. В этой позе плащ своей стороны рука не распирает: он висит у тела, а за руку его убирает шейдер.
    // То же с руками за спиной: локти не выпирают плащ наружу — руки ложатся поверх него (см. шейдер).
    if (j._long && ((j._left ? stW.hipL : stW.hipR) > 0.3 || stW.handsBack > 0.3)) {
      if (!j._cgNoArm || j._cgNoArmOf !== cgBase) {

    j.settings.gravityDir.set(0, -1, 0);
  }

  // ветер и инерция от движения окна + трепет ткани при быстром движении
  {
    const sp = Math.hypot(winM.vx, winM.vy);
    const fl = sp * 0.1 * (Math.sin(time * 5.1) * 0.6 + Math.sin(time * 8.3 + 1.3) * 0.4);   // трепет мягче и медленнее
    // встречный поток (против скорости окна) + сила инерции (против ускорения); силы подобраны так,
    // чтобы при спокойной ходьбе плащ отлетал назад умеренно, а в падении и при рывках мышью — сильно
    const wx = Math.max(-2, Math.min(2, -winM.vx * 0.25 - winM.ax * dt * 0.8));   // спокойная ходьба — умеренный отлёт
    const wy = Math.max(-1.2, Math.min(1.2, -winM.vy * 0.4 - winM.ay * dt));
    const apply = (list, kWind, noLift, liftK = 1) => {
      for (const j of list) {
        const g = j.settings.gravityDir, gp = j.settings.gravityPower;
        const tipK = 0.5 + 0.5 * (j._depth || 0);           // край ткани реагирует сильнее корня
        _ext.copy(g).multiplyScalar(gp);
        _ext.x += (wx + fl * 0.3) * kWind * tipK;
        _ext.y += (noLift ? Math.min(0, wy) : wy > 0 ? wy * liftK : wy) * kWind * tipK;
        _ext.z += fl * kWind * tipK;                         // трепет поперёк потока
        const len = _ext.length();
        if (len > 1e-5) { g.copy(_ext).divideScalar(len); j.settings.gravityPower = len; }
      }
    };
    for (const j of otherJ) { j.settings.gravityDir.copy(j._s0.gravityDir); j.settings.gravityPower = j._s0.gravityPower; }
    apply(coatJ, 1.0, false); apply(skirtJ, 0.6 * (1 - 0.7 * sw), false, 1 - sw);   // сидя поток снизу юбку не задирает apply(otherJ, 0.3, false);
  }

  // начало падения — всплывают вверх, приземление — падают и пружинят
  {
    const ry = root.rotation.y;
    const aF = winM.ax * Math.sin(ry), aL = winM.ax * Math.cos(ry), aU = winM.ay;
    const cl = (v) => Math.max(-0.45, Math.min(0.45, v));

    add('rightUpperArm', cl(0.022 * aF), 0, cl(-0.02 * aL + 0.02 * aU), kIn);
    add('spine', cl(-0.006 * aF), 0, cl(0.006 * aL), kIn);
  }

  // применяем позу (руки/голова — через упругое вторичное движение)
  const legSoft = Math.max(heldW, w.air * (1 - w.walk)) * 0.85;
  for (const name in B) {
    let r = P[name] || _zero3;
    const cfg = SEC[name];
    if (cfg) r = secondary(name, r, dt, cfg[2] === 'leg' ? legSoft : cfg[2] === 'head' ? 0.7 : 1);
    // локоть не сгибается сильнее ~115° (дальше рукава протыкают друг друга) и не выгибается назад
    if (name === 'leftLowerArm' && (r[1] < -2.0 || r[1] > 0.1)) r = [r[0], Math.max(-2.0, Math.min(0.1, r[1])), r[2]];
    else if (name === 'rightLowerArm' && (r[1] > 2.0 || r[1] < -0.1)) r = [r[0], Math.max(-0.1, Math.min(2.0, r[1])), r[2]];
    B[name].rotation.set(r[0], r[1], r[2]);
  }
  if (B.hips && hips0) B.hips.position.set(hips0.x + FLIP * hipShiftL, hips0.y - drop, hips0.z);
  if (ikReq.length) solveArmIK();

  // лицо: эмоция, рот, моргание
  const target = EMOTIONS[emotion] || {};
  for (const n of EXPR_NAMES) {
    exprW[n] = ease(exprW[n] || 0, target[n] || 0, dt, 4);
    expr(n, exprW[n]);
  }
  mouth = ease(mouth, mouthTarget, dt, 18);
  const visLive = time - visAt < 0.4;
  for (const v of VIS) {
    visW[v] = ease(visW[v], visLive ? visT[v] : (v === 'aa' ? 1 : 0), dt, 14);   // губы переходят плавно, без щелчков
    // у «А» рот открыт шире всего, у «И»/«У» — уже: открытие масштабируем по гласной
    const open = v === 'aa' ? 0.9 : v === 'oh' ? 0.8 : v === 'ee' ? 0.7 : 0.65;

    if (sq > 0 && sq < 0.55) expr('blink', 0.75 * pulse(sq, 0.55) * k);

  }

  if (blinkT >= 0) {
    blinkT += dt;
    expr('blink', pulse(blinkT, 0.18));
    if (blinkT > 0.18) { blinkT = -1; blinkAt = time + 2 + Math.random() * 4; if (Math.random() < 0.15) blinkAt = time + 0.25; }  // иногда моргает дважды
  }

  if (B.head) {
    const hp = new THREE.Vector3(); B.head.getWorldPosition(hp);
    lookObj.position.set(hp.x + (look.x + eyeYaw * facing) * 1.5, hp.y + look.y * 0.8, hp.z + 2);
  }

  // заскучала — делает что-нибудь сама
  if (!POSETEST && !lean && !dozing && !anim && !walking && !held && time - lastActivity > 25 && Math.random() < dt / 20) {
    window.roxyLive2D.idle(); lastActivity = time;
  }
}

const exprFrame = {};
function expr(name, v) {
  if (EXTRA_EXPR[name] && (name !== 'surprised' || !HAS_SURPRISED)) {
    let any = false;
    for (const [m, k] of Object.entries(EXTRA_EXPR[name])) if (FCL[m]) { morph(m, v * k); any = true; }
    if (any) return;
    if (name === 'scared') { expr('sad', 0.8 * v); expr('angry', 0.12 * v); return; }   // нет морфов — как раньше
  }
  exprFrame[name] = Math.max(exprFrame[name] || 0, v);
}
function flushExpr() {
  const em = vrm.expressionManager;
  if (!em) return;
  for (const n of ['happy', 'sad', 'angry', 'surprised', 'relaxed', 'aa', 'ih', 'ou', 'ee', 'oh', 'blink']) {
    try { em.setValue(n, Math.min(1, exprFrame[n] || 0)); } catch (e) {}
    exprFrame[n] = 0;
  }
  flushMorphs();
}

// ---------- загрузка ----------
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.load(MODEL_URL, (gltf) => {
  try {
    vrm = gltf.userData.vrm;
    const ver = String(vrm.meta && vrm.meta.metaVersion);
    FLIP = ver === '0' ? -1 : 1;
    VRMUtils.removeUnnecessaryVertices(gltf.scene);
    if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
    VRMUtils.rotateVRM0(vrm);                       // VRM 0.x смотрит назад — разворачиваем
    vrm.scene.traverse(o => { o.frustumCulled = false; });

// ---------- детали текстур: анизотропная фильтрация + кружевное бельё поверх текстуры тела ----------
function improveTextures(vrm) {
  const mats = new Set();
  vrm.scene.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => m && mats.add(m)); });
  const aniso = renderer.capabilities.getMaxAnisotropy();
  for (const m of mats) for (const k of ['map', 'shadeMultiplyTexture', 'normalMap']) {
    const t = m[k]; if (t && t.anisotropy !== aniso) { t.anisotropy = aniso; t.needsUpdate = true; }
  }
  const body = [...mats].filter(m => m.map && /body/i.test(m.name) && /skin/i.test(m.name));
  console.log(`🎨 материалов: ${mats.size}, тело: ${body.map(m => m.name + ' ' + m.map.image.width + 'px').join(', ') || 'не найдено'}`);
  if (!body.length) return;
  const lace = new Image();
  lace.onload = () => {
    try {
      const src = body[0].map.image, W = src.width, Hh = src.height;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = Hh;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      // проверка, что UV тела те же, что в VRoid: под маской кружева исходная текстура должна быть тёмной (там бельё)
      const n = 128, t1 = document.createElement('canvas'); t1.width = t1.height = n;
      const c1 = t1.getContext('2d', { willReadFrequently: true });
      c1.drawImage(src, 0, 0, n, n); const A = c1.getImageData(0, 0, n, n).data;
      c1.clearRect(0, 0, n, n); c1.drawImage(lace, 0, 0, n, n); const M = c1.getImageData(0, 0, n, n).data;
      let lum = 0, cnt = 0;
      for (let i = 0; i < A.length; i += 4) if (M[i + 3] > 200) { lum += (A[i] + A[i + 1] + A[i + 2]) / 765; cnt++; }
      lum = cnt ? lum / cnt : 1;
      if (lum > 0.35) { console.log(`🎨 кружево не наложено: UV тела не совпали (яркость под маской ${lum.toFixed(2)})`); return; }
      cx.drawImage(src, 0, 0); cx.drawImage(lace, 0, 0, W, Hh);
      for (const m of body) for (const k of ['map', 'shadeMultiplyTexture']) {
        const old = m[k]; if (!old || old.image !== src) continue;
        const t = new THREE.CanvasTexture(cv);
        t.flipY = old.flipY; t.colorSpace = old.colorSpace; t.wrapS = old.wrapS; t.wrapT = old.wrapT;
        t.channel = old.channel; t.anisotropy = aniso; t.needsUpdate = true;
        m[k] = t; m.needsUpdate = true;
      }
      console.log(`🎨 кружевное бельё наложено (${W}px, яркость под маской была ${lum.toFixed(2)})`);
    } catch (e) { console.log('🎨 кружево: ' + e); }
  };
  lace.onerror = () => console.log('🎨 файла кружева нет: ' + LACE_URL);
  lace.src = LACE_URL;
}

// ---------- IK рук: кисть ставится в точку относительно тела, плечо и локоть подбираются сами ----------
//            (двухзвенный аналитический IK по закону косинусов; «полюс» задаёт, куда смотрит локоть).
//            Так руки не уходят в тело, и можно положить руку на бедро или ладонь на край экрана.
const _ia = new THREE.Vector3(), _ib = new THREE.Vector3(), _ic = new THREE.Vector3(), _it = new THREE.Vector3();
const _ie = new THREE.Vector3(), _id = new THREE.Vector3(), _ip = new THREE.Vector3(), _iv = new THREE.Vector3();
const _iq = new THREE.Quaternion(), _iq2 = new THREE.Quaternion(), _iq3 = new THREE.Quaternion();
const _bH = new THREE.Vector3(), _bN = new THREE.Vector3(), _bL = new THREE.Vector3(), _bU = new THREE.Vector3(), _bF = new THREE.Vector3(), _bHd = new THREE.Vector3();
const _tmpA = new THREE.Vector3(), _tmpB = new THREE.Vector3();
function aimBone(bone, from, to, w) {
  // повернуть кость так, чтобы направление (кость → from) стало (кость → to); w — доля поворота
  bone.getWorldPosition(_iv);
  const cur = _tmpA.copy(from).sub(_iv), want = _tmpB.copy(to).sub(_iv);
  if (cur.lengthSq() < 1e-8 || want.lengthSq() < 1e-8) return;
  _iq.setFromUnitVectors(cur.normalize(), want.normalize());
  bone.getWorldQuaternion(_iq2);
  _iq.multiply(_iq2);                                        // новая мировая ориентация
  bone.parent.getWorldQuaternion(_iq3);
  _iq3.invert().multiply(_iq);                               // в локальные координаты родителя
  bone.quaternion.slerp(_iq3, w);
  bone.updateMatrixWorld(true);
}
function solveArmIK() {
  root.updateMatrixWorld(true);
  if (!B.hips || !B.leftUpperLeg || !B.rightUpperLeg || !B.neck) return;
  B.hips.getWorldPosition(_bH); B.neck.getWorldPosition(_bN); (B.head || B.neck).getWorldPosition(_bHd);
  B.leftUpperLeg.getWorldPosition(_tmpA); B.rightUpperLeg.getWorldPosition(_tmpB);
  _bU.copy(_bN).sub(_bH).normalize();                        // «вверх» по телу (учитывает наклон к стене)
  _bL.copy(_tmpA).sub(_tmpB); _bL.addScaledVector(_bU, -_bL.dot(_bU)).normalize();   // «влево» модели
  _bF.crossVectors(_bL, _bU).normalize();                    // «вперёд»
  for (const r of ikReq) {
    const ua = B[r.side + 'UpperArm'], la = B[r.side + 'LowerArm'], hd = B[r.side + 'Hand'];
    if (!ua || !la || !hd || r.w <= 0.001) continue;
    const sg = r.side === 'left' ? 1 : -1, w = Math.min(1, r.w);
    // цель кисти и направление локтя в координатах тела
    if (r.type === 'front') {        // кисти сложены перед собой внизу, у верха юбки; руки почти опущены, локти у боков
      // Раньше ладони были у живота с локтями в стороны: предплечья лежали горизонтально, манжеты
      // залезали друг в друга и в корпус, а локти распирали накидку.
      // кисти чуть дальше вперёд, локти меньше назад: предплечья шли сквозь белые полы жакета у бёдер
      _it.copy(_bH).addScaledVector(_bU, -0.02).addScaledVector(_bF, 0.25).addScaledVector(_bL, sg * 0.055);
      _ip.copy(_bL).multiplyScalar(sg * 0.6).addScaledVector(_bF, -0.15).addScaledVector(_bU, -0.4);
    } else if (r.type === 'back') {  // кисти встречаются за спиной у поясницы
      // кисти ниже (у крестца): локти сгибаются меньше — у сильно согнутого рукав заминается красной изнанкой
      // кисти заметно позади спины, локти назад: плащ целиком ложится между руками и спиной
      _it.copy(_bH).addScaledVector(_bU, -0.02).addScaledVector(_bF, -0.27).addScaledVector(_bL, sg * 0.06);
      _ip.copy(_bL).multiplyScalar(sg * 0.5).addScaledVector(_bF, -1.0).addScaledVector(_bU, 0.1);
    } else if (r.type === 'hip') {   // кисть на талии сбоку, локоть наружу
      // локоть больше НАЗАД, чем вбок (как у людей): раньше он был отведён прямо в край накидки —
      // край огибал его с изнанкой наружу, а на сгибе ткань сминалась
      // ладонь на бедре (чуть ниже талии): локоть сгибается меньше — у сильно согнутого рукав модели
      // заминается и показывает красную изнанку
      _it.copy(_bH).addScaledVector(_bU, 0.04).addScaledVector(_bL, sg * 0.175).addScaledVector(_bF, -0.04);
      _ip.copy(_bL).multiplyScalar(sg * 0.45).addScaledVector(_bF, -0.95).addScaledVector(_bU, 0.05);
    } else if (r.type === 'head') {  // ладонь на макушке (потирает ушибленное место)
      _it.copy(_bHd).addScaledVector(_bU, 0.13).addScaledVector(_bL, sg * 0.04).addScaledVector(_bF, 0.02);
      _ip.copy(_bL).multiplyScalar(sg).addScaledVector(_bF, 0.3);
    } else if (r.type === 'mouth') { // запястье у подбородка спереди: ладонь прикрывает рот, локоть вниз и чуть в сторону
      // дальше от груди (0.17): предплечье проходит ПЕРЕД передней полой накидки, а не сквозь неё
      _it.copy(_bHd).addScaledVector(_bU, -0.02).addScaledVector(_bF, 0.17).addScaledVector(_bL, sg * 0.03);

    const hidden = i => { const k = sec(pos.getX(i), pos.getZ(i)); return pos.getY(i) > hem[k] + M; };
    for (let i = 0; i + 2 < a.length; i += 3) {
      all++;
      if (hidden(a[i]) && hidden(a[i + 1]) && hidden(a[i + 2])) { cut++; continue; }
      keep.push(a[i], a[i + 1], a[i + 2]);

}
function splitCoatLayers(v) {
  if (params.get('layers') === '0') return;
  const found = {};
  v.scene.traverse(o => {
    if (!o.isSkinnedMesh) return;
    const ms = [].concat(o.material), m = /^(N00_007_03_Tops_01_CLOTH)_0([12])/.exec((ms[0] && ms[0].name) || '');
    if (m) found[m[2]] = ms;
  });
  if (!found['1'] || !found['2']) return;
  const set = (ms, side) => { const m = ms[0]; if (m && !/Outline/.test(m.name)) { m.side = side; m.needsUpdate = true; } };
  set(found['2'], THREE.FrontSide); set(found['1'], THREE.BackSide);

}
function updateClothCollide() {
  if (!clothCol.meshes.length) return;
  const raw = (n) => vrm.humanoid.getRawBoneNode(n);
  let i = 0;
  for (const sd of ['left', 'right']) {
    raw(sd + 'UpperArm').getWorldPosition(_cw[0]); raw(sd + 'LowerArm').getWorldPosition(_cw[1]); raw(sd + 'Hand').getWorldPosition(_cw[2]);
    // плечо: без самого плечевого сустава, но с запасом ЗА локоть — у согнутой руки кончик локтя выступает
    // за сустав и протыкал край накидки
    clothCol.segA[i].lerpVectors(_cw[0], _cw[1], 0.2); clothCol.segB[i].lerpVectors(_cw[0], _cw[1], 1.12);
    clothCol.segA[i + 1].copy(_cw[1]); clothCol.segB[i + 1].copy(_cw[2]);              // предплечье
    i += 2;
  }
  const ref = clothCol.ref;
  raw('hips').getWorldPosition(_cb1); (raw('neck') || raw('chest')).getWorldPosition(_cb2);
  for (const c of clothCol.meshes) {
    _cm4.copy(c.mesh.matrixWorld).invert();
    c.u.uBodyA.value.copy(_cb1).applyMatrix4(_cm4); c.u.uBodyB.value.copy(_cb2).applyMatrix4(_cm4);   // ось тела
    c.u.uFwd.value.set(Math.sin(root.rotation.y), 0, Math.cos(root.rotation.y)).transformDirection(_cm4);   // куда смотрит
    c.u.uHB.value = stW.handsBack || 0;
    for (let k = 0; k < 4; k++) {
      c.u.uSegA.value[k].copy(clothCol.segA[k]).applyMatrix4(_cm4);
      c.u.uSegB.value[k].copy(clothCol.segB[k]).applyMatrix4(_cm4);
    }
    if (c.damp && ref) {
      c.u.uUp.value.set(0, 1, 0).transformDirection(_cm4);        // «вверх» мира в координатах меша
      // «рука в обычной стойке», прикреплённая к ТЕКУЩЕМУ плечу: плечо поднялось — накидка тоже
      for (let sd = 0; sd < 2; sd++) {
        const ua = raw(ARM_RAW[sd * 2]), la = raw(ARM_RAW[sd * 2 + 1]);
        // насколько рука ПОДНЯТА: задержка накидки нужна только тогда (зевок, потягивание, рука к голове).
        // Когда руки опущены и сведены вперёд (сложены, за спиной), накидка должна идти за плечом целиком —
        // иначе плечо уезжало из-под неё и рукав проступал пятнами.
        ua.getWorldPosition(_cv1); la.getWorldPosition(_cv2);
        const elev = _cv2.sub(_cv1).normalize().y;                // -1 рука вниз, 0 вбок/вперёд, +1 вверх
        const k = CAPE_DAMP * smooth((elev + 0.55) / 0.5);
        _cmU.multiplyMatrices(ua.parent.matrixWorld, ref[sd * 2]);
        _cmL.multiplyMatrices(_cmU, ref[sd * 2 + 1]);
        const iu = c.idx[sd * 2], il = c.idx[sd * 2 + 1];
        if (iu >= 0) { const m = c.u.uDMat.value[sd * 2].multiplyMatrices(_cmU, c.mesh.skeleton.boneInverses[iu]);
                       lerpM4(m, _cmA.multiplyMatrices(ua.matrixWorld, c.mesh.skeleton.boneInverses[iu]), k); }
        if (il >= 0) { const m = c.u.uDMat.value[sd * 2 + 1].multiplyMatrices(_cmL, c.mesh.skeleton.boneInverses[il]);
                       lerpM4(m, _cmA.multiplyMatrices(la.matrixWorld, c.mesh.skeleton.boneInverses[il]), k); }
      }
    }
  }
}

// ---------- тени ----------
// Пятно под ногами — обычный элемент страницы, а не часть 3D-сцены: маска кликов читает только 3D-картинку,
// поэтому полупрозрачная тень не делает фон «твёрдым» для мыши.
const contact = document.createElement('div');
contact.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;opacity:0;' +
  'background:radial-gradient(closest-side, rgba(0,0,0,0.38), rgba(0,0,0,0.18) 55%, rgba(0,0,0,0));z-index:-1;';
document.body.appendChild(contact);
const _sp = new THREE.Vector3(), _sp2 = new THREE.Vector3();
let contactA = 0;
function setupShadows() {
  if (!SHADOWS) { console.log('🌑 тени выключены (live2d_shadows: false)'); return; }
  const ext = 0.62 * H;                                   // коробка тени вокруг модели (с запасом под поднятые руки)
  const sc = sun.shadow.camera;
  sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 0.1; sc.far = 4 * H;
  sc.updateProjectionMatrix();
  let n = 0;
  vrm.scene.traverse(o => {
    if (!o.isMesh) return;
    const nm = [].concat(o.material).map(m => (m && m.name) || '').join(' ');
    o.receiveShadow = true;
    // лицо, глаза, брови и рот тень не отбрасывают (иначе грязные пятна от век и носа), но принимают её от шляпы и волос
    o.castShadow = !/FACE|EYE|Face_00_SKIN|FaceMouth|Brow|Eyeline/i.test(nm);
    n++;
  });
  console.log(`🌑 тени включены (${n} мешей)`);
}
function updateShadows(dt) {
  if (!SHADOWS || !vrm) return;
  // свет «едет» вместе с моделью: коробка тени всегда вокруг неё
  root.getWorldPosition(_sp);
  sun.target.position.set(_sp.x, _sp.y + 0.5 * H, _sp.z);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 2 * H);
  sun.target.updateMatrixWorld();
  // пятно под ногами: только когда стоит/идёт на опоре (не сидит, не в воздухе, не в руке)
  const want = Math.max(0, 1 - w.sit) * (1 - w.air) * (1 - heldW);
  contactA = ease(contactA, want, dt, 6);
  const lf = B.leftFoot, rf = B.rightFoot;
  if (!lf || !rf || contactA < 0.02) { contact.style.opacity = '0'; return; }
  lf.getWorldPosition(_sp); rf.getWorldPosition(_sp2);
  _sp.add(_sp2).multiplyScalar(0.5); _sp.y = 0;        // середина между ступнями, на полу
  _sp.project(camera);
  const W = window.innerWidth, Hc = window.innerHeight;
  const ppm = Hc * 0.70 / H;                                          // пикселей на метр (модель ~70% высоты окна)
  const wpx = 0.42 * ppm, hpx = 0.07 * ppm;
  const x = (_sp.x * 0.5 + 0.5) * W, y = (-_sp.y * 0.5 + 0.5) * Hc;
  contact.style.width = wpx + 'px'; contact.style.height = hpx + 'px';
  contact.style.transform = `translate(${(x - wpx / 2).toFixed(1)}px, ${(y - hpx * 0.45).toFixed(1)}px)`;
  contact.style.opacity = (0.9 * contactA).toFixed(3);
}

// ---------- маска для кликов: непрозрачные пиксели Рокси = «твёрдые», фон окна = сквозной ----------
const HIT_S = 4;                                    // 1 пиксель маски = 4 px окна
const hitCv = document.createElement('canvas');
const hitCtx = hitCv.getContext('2d', { willReadFrequently: true });
let hitData = null, hitW = 0, hitH = 0, hitTick = 0;
window._hitEnabled = false;
function sampleHit() {
  const W = Math.max(1, Math.round(window.innerWidth / HIT_S)), Hh = Math.max(1, Math.round(window.innerHeight / HIT_S));
  if (hitCv.width !== W || hitCv.height !== Hh) { hitCv.width = W; hitCv.height = Hh; }
  hitCtx.clearRect(0, 0, W, Hh);
  hitCtx.drawImage(renderer.domElement, 0, 0, W, Hh);
  hitData = hitCtx.getImageData(0, 0, W, Hh).data; hitW = W; hitH = Hh;
  // датчик мигания: модель загружена и не спрятана одеждой/окном, а в кадре WebGL нет ни одного её пикселя
  let solid = 0;
  for (let i = 3; i < hitData.length; i += 16) if (hitData[i] > 24) { solid++; if (solid > 8) break; }
  if (solid <= 8 && vrm && document.visibilityState === 'visible') {
    const now = performance.now();
    if (now - emptyLogAt > 3000) { emptyLogAt = now; console.log('🔦 пустой кадр WebGL (Рокси не нарисовалась)'); }
  }
}
let emptyLogAt = 0;
window._hitTest = (x, y) => {                       // '1' — под курсором Рокси, '0' — прозрачный фон
  if (!hitData) return '1';
  const ix = Math.floor(x / HIT_S), iy = Math.floor(y / HIT_S);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const px = ix + dx, py = iy + dy;
    if (px < 0 || py < 0 || px >= hitW || py >= hitH) continue;
    if (hitData[(py * hitW + px) * 4 + 3] > 24) return '1';
  }
  return '0';
};

const clock = new THREE.Clock();
let lastFrameAt = 0, lastRafAt = 0, stallLogAt = 0;
const IDLE_FPS = params.get('idlefps') !== null ? Math.max(0, +params.get('idlefps') || 0) : 30, DOZE_FPS = Math.min(IDLE_FPS, 15);
let hoverAt = -99, calmLog = '', calmLogAt = -99;
function calmCap() {
  let c = FPS_CAP;
  if (IDLE_FPS && vrm && !POSETEST) {
    const busy = anim || gesture || gest || react || hops.length || walking || held || heldW > 0.01 || w.air > 0.01
      || airT >= 0 || crouchT >= 0 || landT >= 0 || mouthTarget > 0.05 || mouth > 0.05 || (lean && leanT < 2)
      || w.walk > 0.02 || edge || Math.abs(edgeW - (edge ? 1 : 0)) > 0.02 || Math.abs(w.sit - (sitting ? 1 : 0)) > 0.02 || hat.vel.lengthSq() > 0.0004
      || Math.abs(winM.vx) + Math.abs(winM.vy) > 0.01 || time - hoverAt < 3 || time - lastActivity < 4 || hatFall.st !== 'on';
    if (!busy) c = Math.min(c || 999, dozing ? DOZE_FPS : IDLE_FPS);
  }
  const st = c === FPS_CAP ? '' : String(c);
  if (st && st !== calmLog && time - calmLogAt > 60) { calmLogAt = time; console.log(`🔋 покой: ${st} к/с`); }
  calmLog = st;
  return c;
}
document.addEventListener('visibilitychange', () => console.log(`🔦 страница: ${document.visibilityState}`));
function frame(now) {
  requestAnimationFrame(frame);
  // датчик мигания: кадры не рисовались дольше 250 мс (зависание отрисовки) — пишем в лог, не чаще раза в 5 с
  if (lastRafAt && vrm && time > 8 && now - lastRafAt > 250 && now - stallLogAt > 5000) {   // не во время загрузки
    stallLogAt = now;
    console.log(`🔦 кадр задержался на ${Math.round(now - lastRafAt)} мс`);
  }
  lastRafAt = now;
  if (glLost) return;
  // в покое (стоит/сидит без дела, не говорит, курсор не рядом) — реже кадры, дремлет — ещё реже; на любое действие
  // сразу полная частота. ?idlefps=0 — выключить
  const cap = calmCap();
  if (cap && now - lastFrameAt < 1000 / cap - 1) return;            // ограничение кадров (меньше нагрузка на GPU)
  lastFrameAt = now;
  const dt = Math.min(0.05, clock.getDelta());
  if (vrm) {
    update(dt);
    flushExpr();
    if (lapRoots.length) {                 // перед юбки (roxi_v3) поворачивается на часть поворота бедра — как ткань у паха
      vrm.humanoid.update();
      // сидя корень ещё и опускается к бедру: иначе у пояса ткань вставала горбом над коленями («домиком»)
      const ks = w.sit * (1 - w.air);
      for (const [lap, ul] of lapRoots) {
        if (!lap._p0) lap._p0 = lap.position.clone();
        lap.quaternion.identity().slerp(ul.quaternion, LAP_F);
        lap.position.copy(lap._p0).y -= LAP_DROP * ks * H / 1.75;
      }
    }
    vrm.update(dt);
    vrm.scene.updateMatrixWorld(true);
    updateHat(dt);
    updateHatFall(dt);
    try { if (edgeHold > 0.01) { holdEdgeHands(edgeHold); } edgeHold = 0; } catch (e) { console.log('edge hands: ' + e); }
    try { updateMagic(dt); } catch (e) { if (!magic.err) { magic.err = 1; console.log('magic update: ' + e); } }

resize();
frame(performance.now());

// ---------- API для Python (то же, что у Live2D) ----------
window.roxyLive2D = {
  setDoze(on) {
    if (on && !dozing) { dozing = true; dozeT = 0; nodNext = 6 + Math.random() * 6; gest = null; lean = 0; console.log('😴 задремала'); }
    else if (!on) wake();
  },
  isDozing() { return dozing ? '1' : '0'; },
  poke(x, y) {
    // клик (не перетаскивание): по голове или по телу
    x = +x; y = +y; lastActivity = time;
    if (dozing) { wake(); return; }
    const h = headScreen();
    const onHead = h && Math.hypot(x - h.x, y - h.y) < h.r * 1.2;
    react = { kind: onHead ? 'headPoke' : 'bodyPoke', t: 0 };
  },
  cursorAt(x, y) {
    // курсор над окном (px окна). Быстрые движения туда-сюда над головой — её гладят
    x = +x; y = +y; hoverAt = time;
    const h = headScreen();
    if (!h) return;
    const inside = Math.hypot(x - h.x, y - h.y) < h.r * 1.3;
    if (inside && patLast) {
      const d = Math.hypot(x - patLast.x, y - patLast.y);
      patAcc = patAcc * 0.9 + d;                           // «пройденный путь» за последние ~0.5 с
      if (patAcc > h.r * 1.6) { patSeen = time; lastActivity = time; if (dozing) wake(); }
    } else if (!inside) patAcc = 0;
    patLast = { x, y };
  },
  setViseme(a, i, u, e, o) {
    const arr = [a, i, u, e, o].map(x => Math.max(0, Math.min(1, +x || 0)));
    const sum = arr.reduce((p, q) => p + q, 0) || 1;
    VIS.forEach((v, k) => { visT[v] = arr[k] / sum; });
    visAt = time;
  },
  setMouthOpen(v) { mouthTarget = Math.max(0, Math.min(1, +v || 0)); if (mouthTarget > 0.05) lastActivity = time; },
  lookAt(x, y) { lookTarget = { x: Math.max(-1, Math.min(1, +x || 0)), y: Math.max(-1, Math.min(1, +y || 0)) }; },
  setWalking(on, speed) { walking = !!on; if (+speed > 0) walkSpeed = +speed; if (on) { lastActivity = time; crouchT = -1; } },
  play(name) { play(name); },
  land(strength) {
    airT = -1; crouchT = -1; landT = 0; landK = strength || 1; lastActivity = time;
    if ((strength || 1) >= 0.8 && Math.random() < HAT_DROP_P) setTimeout(() => dropHat('жёсткое приземление'), 80);
    if (reliefPending) {
      reliefPending = false; if (reliefTimer) { clearTimeout(reliefTimer); reliefTimer = null; }
      setTimeout(() => play('shake_off'), 450);
    }
  },
  air() { airT = 0; crouchT = -1; lastActivity = time; },
  dropHat() { return dropHat('команда') ? '1' : '0'; },
  crouch() { crouchT = 0; lastActivity = time; },
  setSitting(on) { sitting = !!on; },
  toggleOutfit() {
    // Num 9: прячем одежду VRoid (верх, низ, платье, обувь, плащ, шляпа), тело с бельём на текстуре остаётся
    if (!vrm) return;
    outfitHidden = !outfitHidden;
    const rx = /(Tops|Bottoms|Onepiece|Outer|Shoes|Socks|Cloth|CLOTH|Hat|Accessory)/;
    const names = new Set();
    vrm.scene.traverse(o => {
      if (!o.isMesh) return;
      const mats = [].concat(o.material).map(m => m && m.name || '');
      if (mats.some(n => rx.test(n)) && !mats.some(n => /Body|SKIN|Face|Hair|EYE/i.test(n) && !rx.test(n))) {
        o.visible = !outfitHidden; mats.forEach(n => names.add(n.replace(/ \(Instance\)/g, '')));
      }
    });
    console.log(`👙 одежда ${outfitHidden ? 'скрыта' : 'возвращена'}: ${[...names].join(', ') || 'ничего не нашла'}`);
  },
  setHeld(on) {
    on = !!on;
    if (on === held) return;
    lastActivity = time;
    if (on) {
      held = true; heldT = 0; anim = null; walking = false; sitting = false; crouchT = -1;
      swingV += 3 * (Math.random() < 0.5 ? -1 : 1);                // её схватили — дёрнулась
      if (reliefTimer) { clearTimeout(reliefTimer); reliefTimer = null; }
      reliefPending = false;
    } else {
      held = false;
      if (heldT > 0.6) {                                            // держали долго — после приземления выдохнет
        reliefPending = true;
        reliefTimer = setTimeout(() => { if (reliefPending) { reliefPending = false; play('shake_off'); } }, 1800);
      }
    }
  },
  setLean(side, wallPx) {
    // опора о край экрана: side -1 — стена слева, +1 — справа; wallPx — где край экрана в координатах окна
    side = +side < 0 ? -1 : +side > 0 ? 1 : 0;
    if (!side) { lean = 0; return; }
    const ppm = 0.70 * window.innerHeight / H;
    wallX = (+wallPx - window.innerWidth / 2) / ppm;
    lean = side; leanT = 0; facing = -side; anim = null; lastActivity = time;
  },
  winPos(x, y) {
    // позиция окна на экране (логические px). Скачок > 400 px (показали/спрятали окно) — не движение
    x = +x; y = +y;
    if (winM.x !== null) {
      const dx = x - winM.x, dy = y - winM.y, now = performance.now() / 1000, dtp = Math.max(0.008, now - winM.t);
      if (Math.abs(dx) < 400 && Math.abs(dy) < 400) { winM.rawx = dx / dtp; winM.rawy = dy / dtp; }
      winM.t = now;
    } else winM.t = performance.now() / 1000;
    winM.x = x; winM.y = y; winM.seen = 1;
  },
  dragMove(vx) { if (held) dragVx += Math.max(-4000, Math.min(4000, +vx || 0)); },
  idle() {
    if (anim || walking) return;
    const r = Math.random();
    play(sitting ? (r < 0.5 ? 'look_around' : r < 0.8 ? 'yawn' : 'stretch')
                 : (r < 0.28 ? 'look_around' : r < 0.42 ? 'yawn' : r < 0.58 ? 'stretch' : r < 0.68 ? 'bow'
                   : r < 0.8 ? 'staff_lean' : r < 0.9 ? 'staff_twirl' : 'magic'));   // посох — и просто так, и поколдовать
  },
  setFacing(dir) { facing = dir < 0 ? -1 : 1; },
  setEdge(mode, dir, wallPx) {
    // игра с окнами: mode 'peek' — выглядывает в сторону dir из-за края, 'push' — толкает окно; '' — закончить.
    // wallPx — где край в координатах окна Рокси
    if (!mode) { edge = null; return; }
    const ppm = 0.70 * window.innerHeight / H;
    edge = { mode: mode === 'push' ? 'push' : 'peek', dir: +dir < 0 ? -1 : 1, x: (+wallPx - window.innerWidth / 2) / ppm };
    edgeT = 0; lean = 0; anim = null; lastActivity = time;
    if (edge.mode === 'peek') facing = edge.dir;
  },
  hop(n) { hop(n || 1); },
  gesture(name) { gesture = { name, t: 0, dur: 1.1 }; },
  setEmotion(name, durationMs) {
    if (!(name in EMOTIONS)) return;
    if (name !== emotion) {
      if (name === 'happy' && !sitting && Math.random() < 0.6) hop(Math.random() < 0.4 ? 2 : 1);
      if (name === 'surprised') hop(1, 1.3);
      if (name === 'smug') gesture = { name: 'nod', t: 0, dur: 0.9 };
      if (name === 'angry') gesture = { name: 'shake', t: 0, dur: 1.1 };
    }
    emotion = name;
    if (emotionTimer) clearTimeout(emotionTimer);
    emotionTimer = (durationMs > 0 && name !== 'neutral') ? setTimeout(() => { emotion = 'neutral'; }, durationMs) : null;
  },
};
