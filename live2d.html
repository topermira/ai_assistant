<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Roxy Live2D</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: transparent !important; font-family: sans-serif;
        }
        #canvas { display: block; width: 100%; height: 100%; background: transparent; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="live2d_assets/js/pixi.min.js"></script>
    <script>window.PIXI = PIXI;</script>
    <script src="live2d_assets/js/live2dcubismcore.min.js"></script>
    <script src="live2d_assets/js/cubism4.min.js"></script>

    <script>
        // ===== Эмоции. У модели нет .exp3.json, поэтому эмоции — наборы параметров.
        // Значения нормированы: 1 = максимум параметра, -1 = минимум, 0 = значение по умолчанию.
        // Если брови уходят «не в ту сторону» — поменяй знак у ParamBrow*Angle / *Form.
        const EMOTIONS = {
            neutral:   { p: {}, head: { x: 0, y: 0, z: 0 } },
            happy:     { p: { ParamEyeLSmile: 1, ParamEyeRSmile: 1, ParamMouthForm: 1, ParamCheek: 0.4,
                              ParamBrowLY: 0.3, ParamBrowRY: 0.3 }, head: { x: 0, y: 2, z: 0 } },
            sad:       { p: { ParamBrowLY: -0.5, ParamBrowRY: -0.5, ParamBrowLForm: -0.6, ParamBrowRForm: -0.6,
                              ParamMouthForm: -0.7 }, head: { x: 0, y: -6, z: 0 } },
            angry:     { p: { ParamBrowLY: -0.4, ParamBrowRY: -0.4, ParamBrowLAngle: -0.8, ParamBrowRAngle: -0.8,
                              ParamBrowLForm: -1, ParamBrowRForm: -1, ParamMouthForm: -0.8 }, head: { x: 0, y: -2, z: 0 } },
            surprised: { p: { ParamBrowLY: 1, ParamBrowRY: 1, ParamMouthForm: 0 }, head: { x: 0, y: 3, z: 0 }, mouth: 0.35 },
            shy:       { p: { ParamCheek: 1, ParamEyeLSmile: 0.5, ParamEyeRSmile: 0.5, ParamMouthForm: 0.4 },
                         head: { x: 0, y: -8, z: 6 } },
            smug:      { p: { ParamEyeLSmile: 0.6, ParamEyeRSmile: 0.6, ParamMouthForm: 0.8, ParamBrowLY: 0.3,
                              ParamBrowRY: -0.1 }, head: { x: 0, y: 0, z: -6 } },
        };
        const EMO_PARAMS = [...new Set(Object.values(EMOTIONS).flatMap(e => Object.keys(e.p)))];

        (async function () {
            try {
                const canvas = document.getElementById('canvas');
                const app = new PIXI.Application({
                    view: canvas,
                    transparent: true,
                    backgroundAlpha: 0,
                    autoStart: true,
                    resizeTo: window,
                    antialias: true,
                });

                const MODEL_URL = 'live2d_assets/models/roxy/Roxy_V1.model3.json';
                const model = await PIXI.live2d.Live2DModel.from(MODEL_URL, {
                    autoInteract: false,
                    autoUpdate: false,
                });
                window._model = model;
                // Контейнер нужен, чтобы разворачивать Рокси лицом в сторону ходьбы (scale.x = -1)
                const holder = new PIXI.Container();
                app.stage.addChild(holder);
                holder.addChild(model);
                let baseY = 0;

                function fitModel() {
                    const bounds = model.getLocalBounds();
                    const scale = Math.min(window.innerWidth / bounds.width, window.innerHeight / bounds.height) * 0.6;
                    model.scale.set(scale);
                    model.x = (window.innerWidth - bounds.width * scale) / 2 - bounds.x * scale;
                    baseY = (window.innerHeight - bounds.height * scale) / 2 - bounds.y * scale;
                    model.y = baseY;
                    holder.pivot.x = window.innerWidth / 2;
                    holder.x = window.innerWidth / 2;
                }
                fitModel();
                window.addEventListener('resize', fitModel);
                // Границы модели без подпрыгиваний — по ним окно ставит ноги на «пол»
                window._stableBounds = () => {
                    const y = model.y; model.y = baseY;
                    const b = model.getBounds();
                    model.y = y;
                    return b;
                };

                const core = model.internalModel.coreModel;

                // ---- диапазоны параметров (min/max/default), с запасным вариантом
                const info = {};
                function paramInfo(id) {
                    if (id in info) return info[id];
                    let r = null;
                    try {
                        const idx = core.getParameterIndex(id);
                        if (idx >= 0 && idx < core.getParameterCount()) {
                            r = { min: core.getParameterMinimumValue(idx), max: core.getParameterMaximumValue(idx),
                                  def: core.getParameterDefaultValue(idx) };
                        }
                    } catch (e) {}
                    info[id] = r;
                    return r;
                }
                function setNorm(id, v) {
                    const i = paramInfo(id);
                    const val = i ? (v >= 0 ? i.def + v * (i.max - i.def) : i.def + v * (i.def - i.min)) : v;
                    try { core.setParameterValueById(id, val); } catch (e) {}
                }
                function setRaw(id, v) { try { core.setParameterValueById(id, v); } catch (e) {} }

                // ---- состояние
                let time = 0;
                let mouthTarget = 0, mouth = 0;
                let lookTarget = { x: 0, y: 0 }, look = { x: 0, y: 0 };
                const weights = Object.fromEntries(Object.keys(EMOTIONS).map(k => [k, k === 'neutral' ? 1 : 0]));
                let emotionTarget = 'neutral', emotionTimer = null;
                // ---- движения: ходьба, прыжки на месте, кивки
                let walking = false, walkPhase = 0, walkAmp = 0;
                let hops = [];                      // [{t, dur, h}]
                let gesture = null;                 // {name, t, dur}
                let facing = 1, facingCur = 1;
                let sitting = false, legsAlpha = 1, crouch = 0, airT = -1;

                // ---- анимации из кода (у модели нет своих motion-файлов и параметров рук,
                //      поэтому всё собрано из головы, тела, глаз, бровей, рта и физики волос)
                let anim = null;                    // {name, t, dur}
                let squash = 0;                     // >0 сплющить (приземление), <0 вытянуть (полёт)
                let spinAngle = 0;
                let lastActivity = 0;               // время последнего «события» — для сонливости
                const ANIMS = {
                    dance:   4.0, spin: 1.0, bow: 1.6, stretch: 2.2, yawn: 2.0, look_around: 2.6,
                };
                function play(name) { if (name in ANIMS) { anim = { name, t: 0, dur: ANIMS[name] }; lastActivity = time; } }
                // что анимация добавляет к параметрам на этом кадре
                function animOffsets() {
                    const o = { ax: 0, ay: 0, az: 0, bx: 0, by: 0, bz: 0, eye: 1, mouth: 0, brow: 0, smile: 0 };
                    if (!anim) return o;
                    const t = anim.t, p = t / anim.dur, env = Math.sin(Math.PI * Math.min(1, p));
                    switch (anim.name) {
                        case 'dance': {
                            const beat = t * 2 * Math.PI * 2.2;             // ~2 такта в секунду
                            o.bz = Math.sin(beat) * 9 * env; o.az = Math.sin(beat) * 7 * env;
                            o.ax = Math.sin(beat / 2) * 14 * env; o.smile = env;
                            if (Math.floor(t * 2.2) !== Math.floor((t - 1 / 60) * 2.2) && t > 0.1) hop(1, 16);
                            break;
                        }
                        case 'spin': spinAngle = p < 1 ? p * 2 * Math.PI : 0; o.smile = env; break;
                        case 'bow': o.ay = -22 * env; o.by = -8 * env; o.eye = 1 - 0.7 * env; break;
                        case 'stretch': o.ay = 18 * env; o.by = 10 * env; o.eye = 1 - 0.9 * env; o.mouth = 0.4 * env; o.brow = 0.6 * env; break;
                        case 'yawn': o.ay = 10 * env; o.eye = 1 - env; o.mouth = 0.9 * env; break;
                        case 'look_around': o.ax = Math.sin(p * 2 * Math.PI) * 28; o.ay = 4 * env; break;
                    }
                    return o;
                }

                function hop(n = 1, h = 28) {
                    for (let i = 0; i < n; i++) hops.push({ t: -i * 0.42, dur: 0.38, h: h * (i ? 0.7 : 1) });
                }
                function hopOffset(dt) {
                    let off = 0;
                    hops = hops.filter(o => { o.t += dt; return o.t < o.dur; });
                    for (const o of hops) if (o.t > 0) off -= Math.sin(Math.PI * o.t / o.dur) * o.h;
                    return off;
                }

                function blendEmotion(dtSec) {
                    const k = 1 - Math.exp(-dtSec * 5);          // ~0.2 c на смену эмоции
                    for (const name in weights) {
                        const t = name === emotionTarget ? 1 : 0;
                        weights[name] += (t - weights[name]) * k;
                    }
                }
                function emotionMix() {
                    const p = {}, head = { x: 0, y: 0, z: 0 };
                    let mouthOpen = 0;
                    for (const name in weights) {
                        const w = weights[name], e = EMOTIONS[name];
                        if (w < 0.001) continue;
                        for (const id in e.p) p[id] = (p[id] || 0) + e.p[id] * w;
                        head.x += e.head.x * w; head.y += e.head.y * w; head.z += e.head.z * w;
                        mouthOpen += (e.mouth || 0) * w;
                    }
                    return { p, head, mouthOpen };
                }

                // 1) Голова, взгляд, эмоции — ДО физики, чтобы волосы реагировали на движения головы
                // (если в твоей версии pixi-live2d-display нет события afterMotionUpdate,
                //  то же самое выполнится в beforeModelUpdate — см. headDone)
                let headDone = false;
                model.internalModel.on('afterMotionUpdate', () => { applyHead(); headDone = true; });
                function applyHead() {
                    const mix = emotionMix();
                    let gx = 0, gy = 0;
                    if (gesture) {
                        const k = Math.sin(Math.PI * Math.min(1, gesture.t / gesture.dur));   // плавно туда-обратно
                        if (gesture.name === 'nod') gy = Math.sin(gesture.t * 14) * 10 * k;
                        if (gesture.name === 'shake') gx = Math.sin(gesture.t * 14) * 14 * k;
                    }
                    const sway = Math.sin(walkPhase) * walkAmp;          // перенос веса с ноги на ногу
                    const step = Math.cos(walkPhase * 2) * walkAmp;       // 2 шага за цикл
                    const a = animOffsets();
                    a.by += -5 * walkAmp + step * 1.5;                     // наклон вперёд + «клевок» на шаге
                    a.ax += -sway * 5;                                     // голова чуть против корпуса
                    a.ay += step * 2;
                    window._animFx = a;
                    const lk = anim && (anim.name === 'look_around' || anim.name === 'bow') ? 0 : 1;   // во время анимации не следит за мышью
                    setRaw('ParamAngleX', lk * look.x * 25 + Math.cos(time * 0.8) * 1.5 + mix.head.x + gx + a.ax);
                    setRaw('ParamAngleY', lk * look.y * 20 + Math.sin(time) * 2 + mix.head.y + gy + a.ay);
                    setRaw('ParamAngleZ', mix.head.z + sway * 4 + a.az);
                    setRaw('ParamBodyAngleX', lk * look.x * 6 + a.bx);
                    setRaw('ParamBodyAngleY', a.by);
                    const kick = sitting ? Math.sin(time * 3.2) : 0;     // «болтает ногами» — качается корпусом, юбка от физики
                    setRaw('ParamBodyAngleZ', sway * 6 + a.bz + kick * 3);
                    if (sitting) setRaw('ParamBodyAngleX', lk * look.x * 6 + a.bx + Math.sin(time * 1.6) * 3);
                    setNorm('ParamEyeBallX', look.x);
                    setNorm('ParamEyeBallY', look.y);
                    for (const id of EMO_PARAMS) {
                        if (id === 'ParamMouthForm') continue;     // рот — ниже, вместе с липсинком
                        let v = mix.p[id] || 0;
                        if (a.smile && (id === 'ParamEyeLSmile' || id === 'ParamEyeRSmile')) v = Math.max(v, a.smile * 0.8);
                        if (a.brow && (id === 'ParamBrowLY' || id === 'ParamBrowRY')) v += a.brow;
                        setNorm(id, v);
                    }
                    window._emotionMix = mix;
                }

                // 2) Рот — в самом конце (после авто-моргания)
                model.internalModel.on('beforeModelUpdate', () => {
                    if (!headDone) applyHead();
                    headDone = false;
                    const mix = window._emotionMix || { p: {}, mouthOpen: 0 };
                    const fx = window._animFx || { eye: 1, mouth: 0, smile: 0 };
                    const open = Math.max(mouth, mix.mouthOpen || 0, fx.mouth);
                    const form = Math.max((mix.p.ParamMouthForm || 0), fx.smile) * (1 - mouth * 0.5) + mouth * 0.2;
                    // сонливость: долго ничего не происходит — глаза полуприкрыты
                    const sleepy = Math.min(1, Math.max(0, (time - lastActivity - 150) / 30));
                    const eyeK = Math.min(fx.eye, 1 - 0.55 * sleepy);
                    if (eyeK < 0.999) {
                        try {
                            for (const id of ['ParamEyeLOpen', 'ParamEyeROpen'])
                                core.setParameterValueById(id, core.getParameterValueById(id) * eyeK);
                        } catch (e) {}
                    }
                    setNorm('ParamMouthOpenY', Math.min(1, open));
                    setNorm('ParamMouthForm', Math.max(-1, Math.min(1, form)));
                });

                app.ticker.add(() => {
                    const dtMs = app.ticker.deltaMS;            // update() ждёт МИЛЛИСЕКУНДЫ (раньше передавался delta ≈ 1)
                    const dt = dtMs / 1000;
                    time += dt * 1.2;
                    mouth += (mouthTarget - mouth) * (1 - Math.exp(-dt * 25));   // сглаживание рта
                    if (mouth < 0.02) mouth = 0;
                    const lk = 1 - Math.exp(-dt * 6);
                    look.x += (lookTarget.x - look.x) * lk;
                    look.y += (lookTarget.y - look.y) * lk;
                    blendEmotion(dt);
                    // ходьба: покачивание тела и подпрыгивание при каждом «шаге»
                    walkAmp += ((walking ? 1 : 0) - walkAmp) * (1 - Math.exp(-dt * 6));
                    walkPhase += dt * 7 * (0.4 + 0.6 * walkAmp);           // разгон/торможение шага
                    // вверх-вниз на каждом шаге: быстро вверх, мягко вниз (не синус, а «отскок»)
                    const ph = (walkPhase / Math.PI) % 1;
                    const bob = -Math.pow(Math.sin(Math.PI * ph), 0.7) * 9 * walkAmp;
                    if (walkAmp > 0.3 && ph < 0.08) squash = Math.max(squash, 0.035 * walkAmp);   // касание ноги
                    // прыжок: присед перед толчком, вытягивание вверх, «поджатие» в верхней точке
                    crouch *= Math.exp(-dt * 10);
                    if (airT >= 0) { airT += dt; squash = Math.min(squash, airT < 0.15 ? -0.08 : airT < 0.45 ? 0.06 : -0.03); }
                    // сидя на окне ноги «за краем окна»: в модели нет параметров ног, поэтому прячем часть «ноги»
                    legsAlpha += ((sitting ? 0 : 1) - legsAlpha) * (1 - Math.exp(-dt * 6));
                    try { core.setPartOpacityById('Part24', legsAlpha); } catch (e) {}
                    if (gesture) { gesture.t += dt; if (gesture.t > gesture.dur) gesture = null; }
                    facingCur += (facing - facingCur) * (1 - Math.exp(-dt * 12));
                    if (anim) { anim.t += dt; if (anim.t > anim.dur) { anim = null; spinAngle = 0; } }
                    squash *= Math.exp(-dt * 9);
                    const sx = Math.abs(facingCur) < 0.05 ? 0.05 * Math.sign(facing) : facingCur;
                    // разворот «вокруг себя»: сжимаем по X через cos — выглядит как поворот на месте
                    holder.scale.x = sx * (spinAngle ? Math.cos(spinAngle) : 1);
                    holder.scale.y = 1 - squash - crouch;
                    holder.scale.x *= 1 + (squash + crouch) * 0.5;          // сохраняем «объём» при сплющивании
                    holder.pivot.y = window.innerHeight; holder.y = window.innerHeight;     // сплющивание от пола
                    model.y = baseY + bob + hopOffset(dt);
                    model.update(dtMs);
                });

                window.roxyLive2D = {
                    setMouthOpen(value) {
                        mouthTarget = Math.max(0, Math.min(1, +value || 0));
                        if (mouthTarget > 0.05) lastActivity = time;
                    },
                    lookAt(x, y) { lookTarget = { x: Math.max(-1, Math.min(1, +x || 0)), y: Math.max(-1, Math.min(1, +y || 0)) }; },
                    setWalking(on) { walking = !!on; if (on) lastActivity = time; },
                    play(name) { play(name); },
                    land(strength) { airT = -1; squash = 0.14 * (strength || 1); lastActivity = time; },
                    air() { airT = 0; crouch = 0; lastActivity = time; },
                    crouch() { crouch = 0.13; lastActivity = time; },          // присед перед прыжком
                    setSitting(on) { sitting = !!on; },
                    idle() {                                  // случайная мелочь, пока стоит
                        if (anim || walking) return;
                        const r = Math.random();
                        play(r < 0.45 ? 'look_around' : r < 0.7 ? 'yawn' : r < 0.9 ? 'stretch' : 'bow');
                    },
                    setFacing(dir) { facing = dir < 0 ? -1 : 1; },
                    hop(n) { hop(n || 1); },
                    gesture(name) { gesture = { name, t: 0, dur: 0.9 }; },
                    setEmotion(name, durationMs) {
                        if (!(name in EMOTIONS)) return;
                        if (name !== emotionTarget) {               // эмоция = выражение лица + движение
                            if (name === 'happy' && Math.random() < 0.6) hop(Math.random() < 0.4 ? 2 : 1);
                            if (name === 'surprised') hop(1, 18);
                            if (name === 'smug') gesture = { name: 'nod', t: 0, dur: 0.7 };
                            if (name === 'angry') gesture = { name: 'shake', t: 0, dur: 0.9 };
                        }
                        emotionTarget = name;
                        if (emotionTimer) clearTimeout(emotionTimer);
                        emotionTimer = (durationMs > 0 && name !== 'neutral')
                            ? setTimeout(() => { emotionTarget = 'neutral'; }, durationMs) : null;
                    },
                };

                console.log("✅ Live2D (Roxy) ready");
            } catch (err) {
                console.error('❌ Ошибка загрузки модели:', err);
            }
        })();
    </script>
</body>
</html>
